<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * /*configurações globais para todos os elementos*/
        { 
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(to bottom, rgb(255, 254, 255), rgb(0, 0, 0));
        }
    </style>
</head>
<body>
    <h1>Testando Gradientes</h1>
</body>
</html>
