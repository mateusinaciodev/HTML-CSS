<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML 5</title>
</head>
<body>
    <h1>Videos hospedados localmente</h1>
    <p>Este é um exemplo de vídeo hospedado no meu próprio servidor</p>
    <video src="midia/skate.mp4" width="500" height="300" poster="images/skate.png" controls autoplay loop></video>
    <video src="midia/skate.webm" width="500" height="300" controls autoplay></video>
    <video src="midia/skate.ogv" width="500" height="300" controls autoplay></video>
    <video src="midia/skate.mov" width="500" height="300" controls autoplay></video>
    <p>Seu navegador não suporta o elemento de vídeo.</p>

    <h1>Inserindo Videos do YouTube</h1>
    <p>Este é um exemplo de vídeo do YouTube</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=bCEly2Uha2IZxr20" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
