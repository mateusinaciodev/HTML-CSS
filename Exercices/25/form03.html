<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
    *
    {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body
    {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        min-height: 100vh;

        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
    }

    form
    {
        background-color: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);

        width: 400px;
    }

    h1
    {
        text-align: center;
        color: white;
        margin-bottom: 20px;
    }

    .container
    {
        width: 400px;
    }

    p
    {
        margin-bottom: 15px;
    }

    label
    {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #444;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[type="month"] 
    {
        width: 100%;
        padding: 12px;

        border: 2px solid #ddd;
        border-radius: 8px;

        font-size: 1rem;

        transition: 0.3s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    input[type="time"]:focus,
    input[type="month"]:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 8px rgba(79, 70, 229, 0.3);
    }

    input[type="submit"],
    input[type="reset"]
    {
        padding: 12px 20px;

        border: none;
        border-radius: 8px;

        font-size: 1rem;
        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }

    input[type="submit"]
    {
        background-color: #4f46e5;
        color: white;
    }

    input[type="submit"]:hover
    {
        background-color: #4338ca;
    }

    input[type="reset"] 
    {
        background-color: #e5e7eb;
        color: #333;
        margin-left: 10px;
    }

    input[type="reset"]:hover 
    {
        background-color: #d1d5db;
    }

    footer
    {
        margin-top: 20px;
        color: rgba(255,255,255,.85);
        text-align: center;
    }

    footer a
    {
        color: white;
        font-weight: bold;
        text-decoration: none;
    }

    footer a:hover
    {
        background-color: red;
        text-decoration: underline;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Aprendendo Formulários</h1>
        <form action="cadastro.php" method="get" autocomplete="on">
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" placeholder="Nome Completo" required maxlength="50" size="30" autocomplete="name">
            </p>
            <p>
                <label for="imedia">Média: </label>
                <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" required> 
            </p>
            <p>
                <label for="idia">Dia da Prova: </label>
                <input type="date" name="dia" id="idia" value="2026-06-19">
            </p>
                <label for="ihora">Horário da Prova: </label>
                <input type="time" name="hora" id="ihora">
            <p>
                <label for="imes">Período Letivo: </label>
                <input type="month" name="mes" id="imes" value="2026-06">
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
    </div>
    <footer>
        <p>
            <small>Formulário criado por Mateus Inácio, me acompanhe no <a href="https://www.github.com/mateusinaciodev" target="_blank">GitHub</a></small>
        </p>
    </footer>
</body>
</html>
