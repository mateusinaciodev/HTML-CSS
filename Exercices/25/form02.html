<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body
        {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: rgb(0, 0, 0);
        }

        h1
        {
            color: #ffffff;
            text-align: center;
        }

        form
        {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #565555;
            border-radius: 5px;
        }

        label
        {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"]
        {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #3e3d3d;
            border-radius: 4px;
        }

        input[type="submit"],
        input[type="reset"]
        {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]
        {
            background-color: #4CAF50;
            color: white;
        }

        input[type="reset"]
        {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Testando Formulários</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="usuario">Usuário: </label>
            <input type="text" name="usuario" id="isuario" required minlength="5" maxlength="15" size="12" placeholder="Digite seu usuário" autocomplete="username">
        </p>
        <p>
            <label for="senha">Senha: </label>
            <input type="password" name="senha" id="isenha" required minlength="8" maxlength="20" size="11" placeholder="Digite sua senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
