<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>

<form action="cadastro.php" method="get" autocomplete="on">
    <p>
        <label for="iano">Que ano você nasceu?</label>
        <input type="number"
               name="ano"
               id="iano"
               min="1900"
               max="2026"
               placeholder="Digite seu ano de nascimento"
               oninput="calcIdade()">
    </p>

    <p>
        <label for="iidade">Sua idade é:</label>
        <output id="iidade">0 anos</output>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</form>

<script>
function calcIdade()
{
    let atual = new Date().getFullYear();
    let ano = document.getElementById("iano");
    let idade = document.getElementById("iidade");

    idade.innerHTML = (atual - Number(ano.value)) + " anos";
}
</script>
