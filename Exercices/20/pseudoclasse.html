<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        div {
            display: inline-block;
            background-color: lightgrey;
            border: 1px solid black;
            text-align: center;
            height: 200px;
            width: 200px;
        }
        div:hover {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div id="01">Item 1</div>
    <div id="02">Item 2</div>
    <div id="03">Item 3</div>
</body>
</html>
