<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible-Box-Model</title>
    <style>
        body
        {
            background-color: gray;
        }

        div.container
        {
            background-color: aqua;
            display: flex;
            flex-flow: row wrap;
            
        }

        div.item
        {
            background-color: blueviolet;
            border: 1px solid black;
            color: white;
            text-align: center;
            /*flex-basis: auto;*/

            flex-basis: 150px;
           /*usamos o flex-basis para tamanho dos itens dentro do container, aqui delimitamos uma dimensão dos itens para 150px independente do conteudo*/
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Ansioso para o curso de JS</div>
        <div class="item">C</div>
        <div class="item">Aprendizado sobre Flex-Basis</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">Importante aprender sobre Flex-Box</div>
    </div>
</body>
</html>
