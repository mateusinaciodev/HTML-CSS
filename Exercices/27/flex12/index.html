<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible-Box-Model</title>
    <style>
        body
        {
            background-color: gray;
        }

        div.container
        {
            background-color: aqua;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item
        {
            background-color: blueviolet;
            border: 1px solid black;
            color: white;
            text-align: center;
            
        }

        div#boxA
        {
            flex-shrink: 1;
            flex-grow: 0;
            flex-basis: 150px;
            /*
            usando shorthand para facilitar
            flex: grow, shrink, basis
            */
        
            flex: 0, 1, 150px;
        }

         div#boxB
        {
            flex-shrink: 1;
            flex-grow: 2;
            flex-basis: auto;
             /*
            usando shorthand para facilitar
            flex: grow, shrink, basis
            */
            flex: 2, 1, auto;
        }

         div#boxC
        {
            flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 200px;
             /*
            usando shorthand para facilitar
            flex: grow, shrink, basis
            */
            flex: 1, 1, 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="boxA">A</div>
        <div class="item" id="boxB">B</div>
        <div class="item" id="boxC">C</div>
    </div>
</body>
</html>
