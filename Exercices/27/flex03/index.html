<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible-Box-Model</title>
    <style>
        body
        {
            background-color: gray;
        }

        div.container
        {
            background-color: aqua;
            display: flex; /*só colocamos o display e o flex-flow no container (pai)*/
            flex-flow: row wrap;
        }

        div.item
        {
            background-color: blueviolet;
            width: 250px;
            height: 50px;
            border: 1px solid black;
            color: white;
            text-align: center;
            flex: auto; /*só funciona no item (filho)*/
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>
</body>
</html>
