<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible-Box-Model Centralizado</title>
    <style>
        *
        {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body
        {
           background-color: gray;
        }

        main /**/
        {
            background-color: lightblue;
            width: 100vw;
            height: 100vh;
            border: 1px solid black;
            /*dessa forma abaixo centralizamos o conteúdo(section) que está dentro do container(main) perfeitamente em todos os tipos de telas*/
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }   
        
        section
        {
            background-color: lightpink;
            width: 200px;
            height: 200px;
            border: 1px solid black;
           
        }

        h1
        {
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
        </section>
    </main>
</body>
</html>
