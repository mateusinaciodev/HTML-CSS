<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 2</title>
    <style>
        *

        body

            background-color: rgb(0, 0, 0);
            text-align: center;
        }

        h1

            padding: 10px;
            background-color: aliceblue;
            margin: 5px;
        }

        table
        {
            border-collapse: collapse;
            margin: auto;

            width: 500px;
        }

        caption

            padding: 10px;
            background-color: aliceblue;

            border: 2px solid black;
        }

        th, td

        }

</head>
<body>
