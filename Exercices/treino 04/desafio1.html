<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Desafio</title>
    <style>
        *
        {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        body
        {
            background-color: black;
        }

        h1
        {
            padding: 10px;
            text-align: center;
            background-color: rgb(255, 255, 255);
        }

        table
        {
            border-collapse: collapse;
            margin: auto;
            width: 600px;
            background-color: rgb(255, 255, 255);
            font-weight: bold;
        }

        tr, td
        {
            border: 2px solid rgb(0, 0, 0);
            padding: 10px;
            text-align: center;
            padding: 20px;
            background-color: lightpink;
        }

        td:hover
        {
            background-color: red;
            text-decoration: solid;
        }

        .maior:hover
        {
            background-color: rgb(255, 234, 0);
            text-decoration: solid;
        }

        .menor:hover
        {
            background-color: blue;
            text-decoration: solid;
        }

        td.maior
        {
            background-color: lightblue;
        }

         td.menor
        {
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <h1>Prática do Segundo Desafio</h1>
    <table>
        <tr>
            <td colspan="4" class="maior">A</td>
            
            
            
        </tr>
        <tr>
            <td rowspan="2" class="menor">D</td>
            <td>E</td>
            <td>F</td>
            <td rowspan="2" class="menor">G</td>
        </tr>
        <tr>
            
            
            <td>J</td>
            <td>K</td>
        </tr>
        <tr>
            
            
            <td colspan="4" class="maior">N</td>
            
        </tr>
    </table>
</body>
</html>
