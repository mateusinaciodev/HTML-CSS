<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABELAS EM HTML</title>
    <style>
        *
        {
            margin: 0px;
            padding: 0px;
        }

        body
        {
            font-family: Arial, Helvetica, sans-serif;   
        }

        h1
        {
            padding: 10px;
            margin: 0 auto;
        }

        table
        {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            text-align: center; /*alinhamento do texto horizontal*/
            vertical-align: top; /*alinhamento vertical */
        }
        table td
        {
            border: 1px solid black;
            padding: 8px;
            border: 2px solid black;
        }

        .xadrez /*para acessar a classe é só por o . e o nome dela*/
        {
            background-color: black;
            color: white;
        }

        td:hover
        {
            background-color: red;
        }

        .xadrez:hover
        {
            background-color: blue;
        }
    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>
    <!--
    HIERARQUIA DE TABELAS(simples)
    TABLE = TABELA 
        TABLE ROW = LINHAS DA TABELA
            TABLE HEADER = CABEÇALHO DA TABELA
                TABLE DATA = DADOS DA TABELA
    -->
    <table>
        <tr> <!--primeira linha-->
            <td class="xadrez">A1</td> <!--coluna A linha 1-->
            <td>B1</td> <!--coluna B linha 1-->
            <td class="xadrez">C1</td> <!--coluna C linha 1-->
            <td>D1</td> <!--coluna D linha 1-->
            
        </tr>
        <tr>
            <td>A2</td> <!--coluna A linha 2-->
            <td class="xadrez">B2</td> <!--coluna B linha 2-->
            <td>C2</td> <!--coluna C linha 2-->
            <td class="xadrez">D2</td> <!--coluna D linha 2-->
        </tr>
        <tr>
            <td class="xadrez">A3</td> <!--coluna A linha 3-->
            <td>B3</td> <!--coluna B linha 3-->
            <td class="xadrez">C3</td> <!--coluna C linha 3-->
            <td>D3</td> <!--coluna D linha 3-->
        </tr>
         <tr>
            <td>A4</td> <!--coluna A linha 4-->
            <td class="xadrez">B4</td> <!--coluna B linha 4-->
            <td>C4</td> <!--coluna C linha 4-->
            <td class="xadrez">D4</td> <!--coluna D linha 4-->
        </tr>
    </table>
</html>
