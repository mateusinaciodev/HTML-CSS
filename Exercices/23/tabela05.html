<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de Tabelas</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body
        {
            background-color: gray;
        }
        
        h1
        {
            background-color: aliceblue;
            text-align: center;
            padding: 20px;
        }

        table
        {
            background-color: aliceblue;
            margin: auto;
            border-collapse: collapse;
            border: 2px solid black;
            padding: 10px;
            width: 500px;
            text-align: center;
        }

        caption
        {
            background-color: aliceblue;
            font-size: 20px;
            border: 2px solid black;
            padding: 8px;
        }

        th, td
        {
            border: 2px solid black;
            padding: 8px;
        } 

    </style>
</head>
<body>
    <h1>Trabalhando com Tabelas</h1>
    <table>
        <caption>Cadastro</caption>
        <thead>
            <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        </thead>
        <tbody> 
            <tr>
                <td>Ana Maria</td>
                <td>Feminino</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
