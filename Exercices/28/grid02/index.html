<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        *
        {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body
        {
            background-color: gray;
        }

        div.container
        {
            background-color: cornsilk;
            display: grid;
            gap: 10px;
            text-align: center;
            border: 2px solid black;
            height: 300px;

            grid-template: 50px 50px 50px 50px / auto auto;
            /*grid-template-columns: auto auto;
            grid-template-rows: 50px 50px 50px 50px;
            usa-se "grid-template como shorthand para grid-template: rows e columns.
            primeiro se adiciona os valores de rows e depois de columns e usa-se a "/" para separar os valores dos rows e dos columns /
           
            place-items: normal normal;
            /*align-items: normal;
            justify-items: normal;
            usa-se "place-items" como shorthand para os itens
            lembrando que "align" é sempre na vertical do item usando o CROSS-AXIS e o "content" é sempre na horizontal usando o MAIN-AXIS*/

            place-content: normal normal;
            /*align-content: normal;
            justify-content: normal;
            usa-se o "place-content" como shorthand para os contents que estão sempre dentro do container, lembrando a regra anterior, align é vertical e content é na horizontal*/
        }

        div.item
        {
            background-color: lightblue;
            border: 2px solid black;
            padding: 5px;
        }
            
    </style>
</head>
<body>
    <main>
        <div class="container">
            <!--escreva div.container que o vsc já criará a div com a classe container, funciona para item também-->
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
        </div>
    </main>
</body>
</html>
