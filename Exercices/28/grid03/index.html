<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        *
        {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body
        {
            background-color: gray;
        }

        div.container
        {
            background-color: cornsilk;
            text-align: center;
            border: 2px solid black;

            /*grid configs*/
            display: grid;
            gap: 10px;
            grid-template-rows: repeat(3, 80px);
            /*grid-template-columns: 1fr 4fr 1fr; desse modo não se usa repeat*/
            grid-template-columns: 100px 40% repeat(2, 1fr);
            grid-auto-flow: rows;
            grid-auto-rows: 80px; /*para novas linhas*/
            grid-auto-columns: 120px; /*para novas*/
            place-items: normal normal ;
            place-content: normal normal;
    
        }

        div.item
        {
            background-color: lightblue;
            border: 2px solid black;
            padding: 5px;
        }
            
    </style>
</head>
<body>
    <main>
        <div class="container">
            <!--escreva div.container que o vsc já criará a div com a classe container, funciona para item também-->
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
            <div class="item">I</div>
            <div class="item">J</div>
        </div>
    </main>
</body>
</html>
