<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Grid-Layout</title>
    <style>
        *
        {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        body
        {
            background-color: gray;
        }

        main
        {
            background-color: lightgoldenrodyellow;
            border: 1px solid black;
        }

        div.container
        {
            background-color: rgb(255, 255, 255);
            border: 1px solid black;
            height: 400px;

            /*grid configs*/
            display: grid;
            grid-template-rows: repeat(5, 80px);
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        div.item-top
        {
            background-color: lightcoral;
            border: 1px solid black;

            grid-area: 1 / 1 / 2 / 6;

            /*grid-row-start: 1;
            grid-column-start: 1;
            grid-row-end: 2;
            grid-column-end: 6;*/
        }

        div.item-menu
        {
            background-color: lightseagreen;
            border: 1px solid black;

            grid-area: 2 / 1 / 3 / 6;
        }

        div.item-main
        {
            background-color: lightslategrey;
            border: 1px solid black;

            grid-area: 3 / 1 / 5 / 5;
        }

        div.item-secundary
        {
            background-color: lightgreen;
            border: 1px solid black;

            grid-area: 3 / 5 / 5 / 5;
        }

        div.item-footer
        {
            background-color: lightpink;
            border: 1px solid black;

            grid-area: 5 / 1 / 6 / 6;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item-top">topo</div>
            <div class="item-menu">menu</div>
            <div class="item-main">principal</div>
            <div class="item-secundary">secundário</div>
            <div class="item-footer">rodapé</div>
        </div>
    </main>
</body>
</html>
