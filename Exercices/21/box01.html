<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo a usar Box Model</title>
    <style>
        body {
            background-color: aquamarine;
            border: 5px solid black;
            padding: 5px;
            margin: 5px;
        }
        
        h1 {
            height: 300px;
            width: 300px;

            padding: 10px;

            border: 10px solid black;

            margin: 10px;

            outline: 10px  black;

            background-color: lightcoral;
            
        }
        p {
            background-color: lightblue;
        }
         a {
            background-color: lightyellow;
            border-width: 5px;
            border-style: solid;
            border-color: rgb(255, 0, 0);
        }
    </style>
</head>
<body>
    <h1>Exemplo caixa Box-Level</h1>
    <p>Parágragos também são exemplos de box-level, mas os <a href="#">links são exemplos de inline-level.</a>Vamos ver como tudo isso funciona.</p>
</body>
</html>
