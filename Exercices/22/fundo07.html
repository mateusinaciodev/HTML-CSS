<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #container
        {
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            padding: 10px;
            height: 500px;
            background-color: purple;
            position: relative; 
            /*position relative é necessário para o alinhamento vertical */
        }
        #content
        {
            position: absolute; 
            /*o position absolute se usa quando queremos posicionar um elemento de forma absoluta em relação ao seu pai posicionado */
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            height: 200px;
            width: 400px;
            background-color: yellow;
            margin: auto;
            left: 50%;
            top: 50%;
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="content">
            <h1>Alinhamento Vertical</h1>
            <p>Este é um exemplo de alinhamento vertical usando CSS. O conteúdo deste artigo está centralizado verticalmente dentro do contêiner.</p>

        </article>
    </section>
</body>
</html>
