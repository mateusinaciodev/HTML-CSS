<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Imagens de Fundo</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
        }
        body
        {
            background-image: url("imagens/wallpaper001.jpg");
            background-size: cover;
        }
        div.quadrado 
        {
            display: inline-block;
            border: 2px solid black;
            border-radius: 10px;
            background-color: lightblue;
            width: 300px;
            height: 300px;
        }
        #q1 
        {
            background-color: lightgrey;
        }
        #q2
        {
            background-image: linear-gradient(to top, red, orange, yellow);
        }
        #q3
        {
            background-image: url(imagens/pattern001.png);
        }
        #q4
        {
            background-image: url("https://www.w3schools.com/css/img_fjords.jpg");
            background-size: cover;
        }
        #q5
        {
            background-image: url("https://www.w3schools.com/css/img_forest.jpg");
            background-size: cover;
        }
        #q6
        {
            background-image: url("https://www.w3schools.com/css/img_mountains.jpg");
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class="quadrado" id="q1"></div>
    <div class="quadrado" id="q2"></div>
    <div class="quadrado" id="q3"></div>
    <div class="quadrado" id="q4"></div>
    <div class="quadrado" id="q5"></div>
    <div class="quadrado" id="q6"></div>
</body>
</html>
